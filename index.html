
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Piyush — A little corner of the internet</title>
  <meta name="description" content="Piyush's personal space for thoughts, experiences, and things in progress.">

  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafaf8;
      --text: #242424;
      --muted: #666666;
      --border: #e8e8e5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.8;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 36px 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    main {
      flex: 1;
      padding-top: clamp(90px, 18vh, 180px);
    }

    h1 {
      font-size: clamp(30px, 5vw, 40px);
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1.3;
      margin: 0 0 28px;
    }

    p {
      font-size: 16px;
      color: var(--muted);
      margin: 0 0 18px;
      max-width: 530px;
    }

    nav {
      display: flex;
      gap: 28px;
      margin-top: 36px;
    }

    a {
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      transition: border-color 0.2s;
    }

    a:hover,
    a:focus-visible {
      border-color: var(--text);
    }

    footer {
      border-top: 1px solid var(--border);
      padding-top: 22px;
      margin-top: 80px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151515;
        --text: #eaeaea;
        --muted: #a0a0a0;
        --border: #353535;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      piyush.page
    </header>

    <main>
      <h1>hey, i'm piyush.</h1>

      <p>
        welcome to my little corner of the internet.
      </p>

      <p>
        a place for things i'm learning, making,
        thinking about, and experiencing along the way.
      </p>

      <nav aria-label="Personal links">
        <a href="#about">about</a>
        <a href="#now">now</a>
        <a href="#journal">journal</a>
      </nav>
    </main>

    <footer>
      made with curiosity · © 2026
    </footer>

  </div>
</body>
</html>
